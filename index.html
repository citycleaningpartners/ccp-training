<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Cleaning Partners: Janitorial Training (Narrated)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F5;--ink:#14213D;--muted:#4A5670;--panel:#fff;--line:#CBD3E0;--yellow:#FFC20E;--navy:#14213D;--sky:#DCE6F2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1526;--ink:#F2F5FA;--muted:#A9B4C9;--panel:#18233D;--line:#2B3A5B;--sky:#22345A}}
:root[data-theme="dark"]{--bg:#0D1526;--ink:#F2F5FA;--muted:#A9B4C9;--panel:#18233D;--line:#2B3A5B;--sky:#22345A}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
main{max-width:920px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(20px,3.4vw,28px);font-weight:800;margin:0 0 12px}
.stage{background:var(--panel);border:2px solid var(--navy);border-radius:6px;overflow:hidden}
.pic{background:var(--sky);aspect-ratio:16/9;width:100%}
.pic svg{width:100%;height:100%;display:block}
.bar{background:var(--navy);color:#fff;padding:14px 18px;border-top:6px solid var(--yellow)}
.bar small{display:block;color:var(--yellow);font-weight:500;margin-bottom:4px}
.bar h2{margin:0;font-size:clamp(18px,3vw,26px);font-weight:800}
.cap{margin:14px 0 0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:16px;line-height:1.55;min-height:96px}
.cap.off{display:none}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
button,select{font:inherit;border:2px solid var(--navy);background:var(--panel);color:var(--ink);padding:10px 16px;border-radius:6px;cursor:pointer;min-height:44px;max-width:100%}
button.play{background:var(--yellow);color:#14213D;font-weight:800;min-width:110px}
button:focus-visible,select:focus-visible{outline:3px solid #1B9E6B;outline-offset:2px}
.dots{display:flex;gap:6px;margin-top:14px}
.dots button{flex:1;min-height:12px;height:12px;padding:0;border:0;background:var(--line);border-radius:2px}
.dots button.on{background:var(--yellow);outline:1px solid var(--navy)}
.dots button.done{background:var(--navy)}
.quiz{padding:20px}
.quiz details{margin:10px 0;border:1px solid var(--line);border-radius:6px;padding:10px 14px;background:var(--panel)}
.quiz summary{cursor:pointer;font-weight:800}
.note{color:var(--muted);font-size:13px;margin-top:14px}
.sk{fill:#E0A877}.n{fill:#14213D}.y{fill:#FFC20E}.w{fill:#fff}.g{fill:#9AA6BA}.r{fill:#D7263D}.gr{fill:#1B9E6B}
</style>
</head>

<h1>City Cleaning Partners: Janitorial Training</h1>
<div class="stage">

</div>

  <button id="prev">Back</button><button id="play" class="play">Play</button><button id="next">Next</button>
  <label>Speed <select id="spd"><option value="0.9">Slow</option><option value="1" selected>Normal</option><option value="1.15">Fast</option></select></label>
  <button id="cc" aria-pressed="true">Captions on</button>
</div>
<div class="dots" id="dots"></div>
<p class="note" id="note"></p>
</main>

var M=[
["Welcome and Safety Responsibilities",[
["Welcome to City Cleaning Partners",[["Healthy people","person"],["Safe buildings","building"],["Open businesses","check"]],"Welcome to City Cleaning Partners. The work you do keeps people healthy, buildings safe, and businesses open. Clean buildings do not happen by accident. They happen because trained professionals like you show up and do the job right. This series will teach you how to do that job safely and well."],
["Why safety comes first",[["Chemicals","flask"],["Slips and falls","sign"],["Lifting strains","box"],["Machines","machine"],["Sharp objects","alarm"]],"Janitorial work involves chemicals, wet floors, machines, lifting, and long hours on your feet. Most injuries in this field are preventable. Our goal is simple: everyone goes home the same way they came in."],
["Who is responsible for what",[["Company: train and equip","shield"],["Supervisor: guide","clip"],["You: follow and report","person"]],"Safety is a shared job. The company provides training, equipment, protective gear, and safe procedures. Your supervisor assigns work fairly, answers questions, and fixes hazards you report. You follow your training, wear your protective equipment, use tools as designed, and speak up when something is wrong."],
["Your right to stop work",[["Stop","stop"],["Report","phone"],["Wait for instructions","timer"]],"If a task looks unsafe, stop and call your supervisor. You should never be punished for raising a safety concern in good faith. Workers have legal rights to a safe workplace and to report hazards. Ask your supervisor where the safety information is posted at each site."],
["Daily habits",[["Check equipment","machine"],["Know exits and first aid","cross"],["Follow labels","flask"],["Ask questions","phone"]],"Build these habits from day one. Check your equipment before you use it. Know where the exits, first aid kit, and eyewash station are at every site. Never take shortcuts with chemicals. Ask when you are unsure. Asking a question is never a mistake."]],
["Who is responsible for safety?","The company, your supervisor, and you."]],
["Personal Protective Equipment",[
["What PPE does",[["Last line of defense","shield"],["Choose it correctly","check"],["Wear it every time","person"]],"Personal protective equipment, or PPE, is your last line of defense. It does not remove a hazard. It stands between the hazard and your body. That is why you must choose it correctly and wear it every time it is required."],
["The basics",[["Gloves","glove"],["Eye protection","goggles"],["Non-slip footwear","boot"],["Apron or coveralls","person"]],"Gloves protect your hands from chemicals, germs, and sharp objects. Eye protection, such as splash goggles, protects against splashes when you pour or mix. Non-slip, closed-toe footwear protects your feet and helps prevent falls. Aprons or coveralls protect your clothing and skin. Masks or respirators are used only when the label, the Safety Data Sheet, or your supervisor says they are needed."],
["Match the glove to the job",[["Check the SDS","book"],["Change between areas","glove"],["Replace if torn","check"]],"Not all gloves are the same. Disposable nitrile gloves work well for restrooms and general cleaning. Heavier, chemical-resistant gloves are used for strong cleaners and stripping products. Always check the Safety Data Sheet for the glove type it recommends. Never reuse a torn glove, and never wear gloves from one job to another, such as from a restroom to a break room."],
["Respirators and fit",[["Training","book"],["Medical clearance","cross"],["Fit test","mask"]],"Some tasks, like heavy dust or certain chemicals, may require a respirator. If you are required to wear one, you must be trained, medically cleared, and fit tested by your employer. Do not wear a respirator you have not been trained to use. A loose or ill-fitting mask gives you a false sense of safety."],
["Putting on and taking off",[["Gear up first","shield"],["Remove carefully","glove"],["Dispose","bucket"],["Wash hands","hand"]],"Put on protective gear before you touch the chemical or begin the task. When you finish, remove gloves carefully so the outside never touches your skin, pulling one glove off inside the other. Dispose of used gloves properly. Then wash your hands with soap and water, every time."],
["Inspect and care for PPE",[["Inspect each shift","eye"],["Clean and store","bucket"],["Replace if damaged","check"]],"Before every shift, inspect your PPE for cracks, tears, or stiffness. Clean reusable items as instructed and store them away from chemicals and heat. If it is damaged, replace it. Ask your supervisor. Protective gear should never be something you pay for or go without."]],
["What do you do right after removing gloves?","Wash your hands."]],
["Chemical Safety and Hazard Communication",[
["Why chemical safety matters",[["Burns","drop"],["Harmful fumes","skull"],["Right to know","book"]],"Cleaning chemicals do a lot of work for you, but they can burn skin, damage eyes, and release harmful fumes. Most chemical injuries happen because someone mixed products, skipped the label, or did not wear protection. You have a right to know what is in the products you use. That right is called Hazard Communication."],
["Read every label",[["Product name","flask"],["Signal word","alarm"],["Hazard statements","stop"],["Precautions","shield"]],"Every product label has key information: the product name, a signal word, either Danger or Warning, with Danger meaning the more severe hazard, hazard statements, precautions, and the manufacturer's contact. Read the label every time you pick up a bottle, even if you have used it a hundred times. Formulas change."],
["Know the pictograms",[["Flame","bolt"],["Corrosion","drop"],["Irritant","sign"],["Toxic","skull"],["Health hazard","cross"]],"Pictograms are the red-bordered diamond symbols on labels. The flame warns the product can ignite. The corrosion symbol means it can burn skin and eyes or damage metals. The exclamation mark means it can irritate skin or eyes. The skull and crossbones means acute toxicity. The health hazard symbol points to serious long-term effects. Learn these on sight."],
["Use the Safety Data Sheet",[["16 sections","book"],["Hazards","sign"],["First aid","cross"],["Spill response","drop"]],"The Safety Data Sheet, or SDS, is the complete safety document for a product. It has sixteen sections. The ones you will use most are hazards, first aid, handling and storage, exposure controls and PPE, and spill response. Your employer must keep an SDS for every hazardous product on site, and you must be able to reach it during your shift. Ask your supervisor where the SDS binder or digital system is at each location."],
["Never mix chemicals",[["Bleach + ammonia","spray"],["Bleach + acids","drop"],["Toxic gas","skull"]],"This is the most important rule in this module: never mix cleaning products unless the label specifically tells you to. Mixing bleach with ammonia can produce toxic gas. Mixing bleach with acids, such as some toilet bowl or descaling products, can release chlorine gas. Do not mix products in the same bucket, and do not use a second product on a surface that still has the first one on it. If you are not sure, rinse the surface well first or ask your supervisor."],
["Dilution, containers, and labels",[["Dilute as labeled","bucket"],["Label every bottle","spray"],["No food containers","stop"]],"Always dilute exactly as the label says. More product does not clean better. It wastes money, leaves residue, and raises risk. Add the product to water, not water onto strong product, unless the label says otherwise, so splashing is reduced. Any secondary container, like a spray bottle, must be labeled with the product name and hazards. Never put chemicals in food or drink containers."],
["Storage and spills",[["Ventilated, controlled storage","lock"],["Small spill: PPE and contain","mop"],["Large spill: leave and call","phone"]],"Store chemicals in a ventilated, locked or controlled area, away from heat, with heavy items on low shelves and incompatible products kept apart. For a small spill, put on your PPE, block off the area, contain it, and clean it up following the SDS. For a large spill or any spill you do not understand, leave the area, keep others away, and call your supervisor."],
["If you are exposed",[["Eyes: flush 15 minutes","eye"],["Skin: rinse","drop"],["Fumes: fresh air","person"],["Report and get help","phone"]],"If a chemical gets in your eyes, go to the eyewash station right away and flush for at least fifteen minutes, or as directed by the SDS. If it gets on your skin, remove contaminated clothing and rinse with plenty of water. If you breathe fumes and feel dizzy or sick, get to fresh air. Then tell your supervisor and get medical help. Bring the product name or the SDS with you."]],
["Can you mix two cleaners for extra strength?","No. Never mix products unless the label says so."]],
["Slip, Trip, and Fall Prevention",[
["The problem",[["Slips","drop"],["Trips","cord"],["Falls","ladder"]],"Slips, trips, and falls are among the leading causes of workplace injury. In janitorial work, you create some of the hazards yourself when you mop, strip, or run machines. That means you are also the person best placed to prevent them."],
["Slip, trip, or fall",[["Slip: low traction","drop"],["Trip: obstacle","cord"],["Fall: height or balance","ladder"]],"A slip happens when there is not enough grip between your shoe and the floor, from water, soap, wax, or grease. A trip happens when your foot hits something, like a cord, a bucket, or an uneven surface. A fall can follow either one, or come from a ladder, a stair, or a platform. Different causes, different fixes."],
["Wet floor signs and barriers",[["Sign before you mop","sign"],["Cover every approach","sign"],["Remove when dry","check"]],"Place wet floor signs before you start mopping, not after. Put them at every approach, so no one can walk into a wet area without seeing one. For big areas, use cones or barriers to block off the space. Leave signs up until the floor is completely dry, then remove them. A sign left out after the floor is dry teaches people to ignore signs."],
["Safe mopping technique",[["Far to near","mop"],["Wring well","bucket"],["Non-slip shoes","boot"]],"Work from the farthest point back toward the exit so you never walk across a wet floor. Wring the mop well, because a soaked mop leaves puddles. Mop in an S pattern to stay in front of your work. Wear non-slip shoes, and keep your own footing steady."],
["Cords, carts, and clutter",[["Cords along walls","cord"],["Cart out of exits","box"],["Pick up clutter","bucket"]],"Route cords along walls and away from walkways. Tape or cover them if they must cross a path. Park your cart where it will not block a doorway or exit, and keep the aisles clear. Pick up anything on the floor that does not belong there. Good housekeeping is trip prevention."],
["Stairs and ladders",[["Inspect the ladder","ladder"],["Three points of contact","person"],["Never stand on top step","stop"]],"On stairs, use the handrail, and do not carry loads that block your view. Take your time. For ladders, inspect them first and set them on level, stable ground. Face the ladder, keep three points of contact, and never stand on the top step or the top rung. Do not overreach. Climb down and move the ladder."],
["If someone falls",[["Ask if they are hurt","person"],["Call for help","phone"],["Report the hazard","clip"]],"If someone falls, do not rush to lift them. Ask if they are hurt. Call for help and notify your supervisor. Keep the area clear. Report the hazard that caused it so it can be fixed."]],
["When do you put out a wet floor sign?","Before you start mopping."]],
["Floor Machines and Powered Equipment",[
["Respect the machine",[["Trained operators only","person"],["Floor machines","machine"],["Ask if unsure","phone"]],"Powered equipment saves hours of labor, but it also causes injuries when people rush or skip training. You may only operate a machine you have been trained and authorized to use. If you have not been shown how, ask."],
["Inspect before every use",[["Cord and plug","cord"],["Guards","shield"],["Pads, hoses, battery","machine"],["Damaged? Tag it out","stop"]],"Before every use, walk around the machine. Check the power cord for cuts or exposed wire, the plug for damage, the handles and guards, the pads or brushes, the hoses and squeegee, and the battery. If a cord is frayed or a guard is missing, tag the machine out of service and tell your supervisor. Never use a damaged machine."],
["Electrical safety",[["Grounded outlets","bolt"],["Rated extension cords","cord"],["Pull the plug, not the cord","cord"],["Unplug before servicing","machine"]],"Water and electricity are a dangerous mix. Plug into properly grounded outlets, and never remove the grounding prong. Use only extension cords rated for the machine. Never pull a plug out by the cord, and never run a cord through standing water. Unplug the machine before you change a pad, brush, or any part."],
["Scrubbers and buffers",[["Firm grip","machine"],["Steady pace","timer"],["Slow on slopes and corners","sign"],["Never leave it running","stop"]],"Start any floor machine with your hands firmly on the controls. A rotary machine can pull away from you, so hold it steady and let the machine do the work. Move at a controlled pace. With ride-on or walk-behind scrubbers, take corners and slopes slowly, watch for people, and never leave a running machine unattended. When you finish, shut it off and secure it according to the manufacturer's instructions."],
["Vacuums, extractors, and blowers",[["Empty before full","vac"],["Check filters","shield"],["Approved solutions only","flask"],["Eye protection with blowers","goggles"]],"With vacuums, empty the canister or bag before it is full, check the filter, and use HEPA filtration where required. With carpet extractors, use only the solution the manufacturer approves, and keep hoses and cords from crossing walkways. With blowers, wear eye protection, and keep dust away from people and food areas."],
["Batteries and charging",[["Ventilated charging area","building"],["Correct charger only","bolt"],["Report swelling or leaks","alarm"]],"Charge batteries in a ventilated area, away from open flame and sparks, using only the charger made for that battery. Follow the manufacturer's instructions for lead-acid and lithium batteries. Wear gloves and eye protection when handling lead-acid batteries or checking water levels. Report any swelling, leaking, or burning smell right away."],
["Lifting, transport, and storage",[["Get help","people"],["Bend your knees","person"],["Store clean and dry","box"]],"Never lift heavy equipment alone. Use a cart or ask for help. Bend your knees, keep the load close, and avoid twisting. Store machines clean, dry, and parked out of walkways, with cords coiled loosely, never wrapped tight around the machine."]],
["What do you do before changing a pad?","Unplug the machine."]],
["Restroom Hygiene and High-Touch Cleaning",[
["Why restrooms matter",[["Professional","star"],["Protects health","cross"],["Prevents spread","hand"]],"A clean restroom tells everyone who uses it that this building is cared for. It also protects people from illness. Done right, restroom cleaning prevents germs from spreading. Done wrong, it carries them from room to room."],
["Prepare and set up",[["Fresh gloves","glove"],["Signs at the door","sign"],["Color-coded tools","bucket"],["Labeled products","spray"]],"Put on fresh gloves and any other PPE the products require. Place a wet floor sign and a closed-for-cleaning sign at the door. Stock your cart with color-coded cloths and mops so restroom tools never touch other areas. Check that your products are labeled, and read the label on anything you have not used before."],
["Clean versus disinfect",[["Clean first","spray"],["Then disinfect","drop"],["Respect dwell time","timer"]],"Cleaning removes dirt and soil. Disinfecting kills germs, but only on a clean surface, and only if the product stays wet on the surface for its full dwell time. That is the contact time listed on the label. If the surface dries too early, the product may not work. Always clean first, then disinfect."],
["The cleaning order",[["Top to bottom","spray"],["Clean to dirty","clip"],["Toilets last","toilet"],["Floors last","mop"]],"Work from clean to dirty and from top to bottom. First, empty trash and restock supplies. Next, apply product to mirrors, sinks, and counters and let it sit. Then apply toilet bowl cleaner and let it work. Wipe mirrors, then counters and sinks, then partitions and door handles. Clean the toilets and urinals last, using dedicated tools. Finally, mop the floor, moving out of the room toward the door."],
["Prevent cross-contamination",[["One cloth, one zone","bucket"],["Change gloves between zones","glove"],["Wash hands","hand"]],"Never use a toilet cloth on a sink, and never use a restroom cloth anywhere else. Change cloths and gloves when they are soiled and when you move between zones. Dispose of used gloves properly and wash your hands when you finish."],
["Sharps and biohazards",[["Needle or blood? Do not touch","stop"],["Keep others away","people"],["Call your supervisor","phone"]],"Never pick up a needle or sharp object with your hands. If you have been trained, use tongs or a pick-up tool and place it in a sharps container. If you see blood or body fluids, do not clean it up unless you have been trained and equipped for it. Stay away, keep others away, and call your supervisor."],
["High-touch surfaces",[["Door handles","lock"],["Switches and buttons","bolt"],["Handrails and faucets","hand"],["Shared equipment","phone"]],"High-touch surfaces are the places many hands land: door handles, push plates, elevator buttons, light switches, handrails, faucet handles, and shared equipment such as phones and copiers. Wipe and disinfect these on a regular schedule, and more often during flu season or illness outbreaks. Pay attention to the little things. They matter most."]],
["What is dwell time?","How long a disinfectant must stay wet on a surface to work."]],
["Floor Stripping, Waxing, and Refinishing",[
["What stripping is",[["Strip","machine"],["Rinse","drop"],["Seal and finish","mop"]],"Over time, floor finish wears down and collects dirt that regular cleaning cannot remove. Stripping removes the old finish completely, and new finish is then applied in coats. It is one of the most demanding tasks in our work, and it needs planning, the right products, and the right protective gear."],
["Plan the job",[["Check floor type","clip"],["Close the area","sign"],["Gather tools","bucket"],["Read the SDS","book"]],"Check the floor type, and strip only what the manufacturer allows. Confirm the schedule with your supervisor so the area is closed to foot traffic. Gather a rotary machine with the correct pads, a wet vacuum, mops and buckets, the stripper and finish, and your PPE. Read the label and SDS for every product."],
["Prepare the area and yourself",[["Clear and sweep","mop"],["Chemical-resistant gloves","glove"],["Splash goggles","goggles"],["Barricade the area","sign"]],"Move furniture and clear the floor, then sweep or dust mop. Put on chemical-resistant gloves, splash goggles, non-slip boots, and an apron if required. Provide ventilation, and block off every entrance with signs and barriers. Strippers are slippery and fumes can be strong, so keep the area controlled."],
["Apply stripper and wait",[["Dilute correctly","bucket"],["Work in sections","clip"],["Respect dwell time","timer"],["Never let it dry","stop"]],"Dilute the stripper exactly as the label says. Apply it in manageable sections so it never dries on the floor. Let it dwell for the time on the label, because this is where the chemical does its work. Do not rush. If the stripper dries, it can leave a sticky film and make the job harder."],
["Scrub and pick up",[["Agitate with the machine","machine"],["Pick up the slurry","vac"],["Rinse, then rinse again","drop"]],"Use the machine with the correct pad to agitate the softened finish, and keep the cord clear. Pick up the slurry with a wet vacuum. Rinse the floor with clean water, and rinse again if needed so no stripper residue remains. Residue prevents the new finish from sticking."],
["Neutralize and inspect",[["Neutralize if required","flask"],["Dry fully","timer"],["Inspect","eye"]],"If the stripper requires neutralizing, follow the label. Let the floor dry fully, then check that it is clean and free of residue. A clean, dry floor is the foundation for a good finish."],
["Apply the finish",[["Thin, even coats","mop"],["Dry between coats","timer"],["Follow the label","book"],["Keep people off","stop"]],"Apply thin, even coats using a clean mop and a clean bucket, and do not overlap more than needed. Let each coat dry completely before the next. The label tells you how many coats and the drying times. Keep the area blocked off until the floor is fully cured, because walking on it too soon can cause slips and ruin the finish."],
["Waste and cleanup",[["Dispose properly","bucket"],["Clean and store tools","machine"],["Record the job","doc"]],"Dispose of slurry and used chemicals according to your site rules and local regulations, and never pour them down storm drains. Clean and store your equipment. Remove signs only when the floor is safe, and record what you did and the date."]],
["Why rinse thoroughly after stripping?","Leftover residue keeps the new finish from bonding."]],
["Schools, Healthcare, and Occupied Facilities",[
["Working around people",[["People first","people"],["Quiet and aware","person"],["Protect from fumes and wet floors","sign"]],"In many buildings, you will work while people are present. That changes how you clean. You need to be quiet, aware, and polite. You must also protect the people around you from chemical fumes, wet floors, and equipment."],
["Rules for occupied spaces",[["Greet people","people"],["Cart out of the way","box"],["Low odor","spray"],["Keep it confidential","lock"]],"Greet people. Keep your cart where it will not block anyone. Use low-odor products when possible. Do not leave chemicals unattended. Keep wet floor signs visible. If a person has a question, answer politely or direct them to your supervisor. Never discuss what you see or hear in a client's building with anyone outside work."],
["Schools",[["Approved products only","check"],["Chemicals out of reach","lock"],["Follow visitor rules","book"]],"In schools, children are more sensitive to chemicals and germs. Many states require schools to use approved green cleaning products, so check your site rules and use only approved products. Never leave chemicals where students can reach them. Keep cleaning carts locked or attended. Pay special attention to desks, door handles, restrooms, cafeterias, and drinking fountains. Follow the school's policies for visitors, and do not enter classrooms without permission when students are present."],
["Healthcare facilities",[["Hospital-grade disinfectants","drop"],["Follow infection control plan","book"],["Isolation rooms: instructions and PPE","mask"]],"Hospitals, clinics, and care homes have the highest infection control standards. You may be required to use hospital-grade disinfectants with specific dwell times, special cloths, and strict cleaning order. Learn the facility's procedures for isolation rooms and for regulated medical waste. Never enter an isolation room without instructions and the right PPE. Never handle medical waste unless you are trained."],
["Bloodborne pathogens",[["Treat all blood as infectious","cross"],["PPE, no sharps","glove"],["Report exposure now","phone"]],"Blood and certain body fluids can carry infections. Employers must train workers who may be exposed. Treat all blood and body fluids as potentially infectious. Use gloves and other PPE, do not touch sharps, and report any exposure immediately. If you have any contact with blood, wash the area right away and tell your supervisor so you can get medical care."],
["Privacy and respect",[["Don't read papers","doc"],["Don't look at screens","eye"],["Don't take photos","stop"]],"In healthcare and many offices you may see private information, patient records, or personal belongings. Do not read documents, move papers, look at screens, or touch personal items. Do not take photos. Protect everyone's privacy, always."],
["Safety when working alone",[["Check in","phone"],["Lock doors as instructed","lock"],["Leave if something feels wrong","alarm"]],"Night work can mean empty buildings. Know your site's check-in procedures. Carry a phone or radio. Lock doors behind you as instructed. If something feels wrong, leave the area and call your supervisor."]],
["What do you do if you see blood?","Do not touch it. Keep others away and call your supervisor."]],
["Post-Construction Cleaning",[
["A different kind of clean",[["Fine dust","vac"],["Debris","box"],["Sharp objects","alarm"]],"Post-construction cleaning is not the same as routine janitorial work. The building is full of fine dust, debris, stickers, adhesives, and sharp objects. The goal is to turn a work site into a space ready for people. It takes planning, patience, and careful attention to safety."],
["The three stages",[["Rough clean","bucket"],["Final clean","spray"],["Touch-up","star"]],"Most projects are cleaned in three stages. The rough clean happens during or just after construction. It removes large debris, packaging, and heavy dust. The final clean happens when construction is complete. It covers every surface, inside and out. The touch-up clean happens right before the client moves in. It catches fingerprints, dust, and anything that settled. Confirm with your supervisor which stage you are doing."],
["Site hazards and PPE",[["Sturdy shoes","boot"],["Gloves","glove"],["Eye protection","goggles"],["Follow site rules","book"]],"Construction sites have hazards that offices do not. Expect nails, screws, glass, exposed edges, uneven floors, and unfinished work. Wear sturdy closed-toe shoes, gloves, eye protection, and a hard hat if the site requires one. Check in with the site manager and follow site rules. Know where the exits are. Never enter areas that are marked as restricted."],
["Dust control",[["No dry sweeping","stop"],["No compressed air","stop"],["HEPA vacuum","vac"],["Damp wipe","spray"]],"Construction dust can be very fine, and some of it, like silica dust from concrete, drywall, and stone, is hazardous to breathe. Do not dry sweep or use compressed air to blow dust around. Use HEPA-filtered vacuums, damp wipes, and wet methods where appropriate. Work from top to bottom so settled dust is not dropped onto surfaces you have already cleaned. If dust is heavy, ask your supervisor about respiratory protection, and wear it only if you have been trained and fit tested."],
["Order of work",[["Debris first","box"],["High dust","ladder"],["Fixtures and windows","eye"],["Floors last","mop"]],"Start by removing large debris and packaging. Then vacuum high surfaces: vents, ledges, and tops of doors and cabinets. Next, clean light fixtures, windows, and frames. Then clean walls, doors, and trim. Clean cabinets, counters, and fixtures. Finish with floors. Always follow this order so dirt falls to the next level, not onto finished work."],
["Windows, glass, and surfaces",[["Plastic scrapers first","clip"],["Test a hidden spot","eye"],["Right product, right surface","flask"]],"Remove stickers and protective films carefully. Use plastic scrapers on delicate surfaces. Use a razor scraper on glass only if you are trained, and never on coated or tinted glass. Test cleaners in a small hidden spot first. Using the wrong product on stone, stainless steel, or finished wood can cause permanent damage."],
["Debris and disposal",[["Sort waste","bucket"],["Handle sharps safely","alarm"],["Unknown material? Stop and ask","phone"]],"Sort waste as you go: general debris, recyclables, and anything hazardous. Never put sharp items or leftover chemicals into regular trash without checking site rules. Paint, adhesives, solvents, and similar leftovers are the contractor's or site's responsibility. If you find something that could be hazardous, stop and tell your supervisor."],
["Final walk-through",[["Good light","bolt"],["Check at angles","eye"],["Use the checklist","clip"],["Get sign-off","check"]],"Finish by walking the space with a checklist and good lighting. Look low, high, and at an angle. Check corners, tracks, vents, and inside cabinets. Fix what you find. Then ask your supervisor for sign-off."]],
["Why avoid dry sweeping?","It spreads fine dust, some of it hazardous."]],
["Incident Reporting and Emergency Response",[
["Why reporting matters",[["Injuries","cross"],["Near misses","alarm"],["No blame","people"]],"Every incident teaches us something. An injury, a spill, a near miss, or a hazard report can prevent the next one. Report everything, even if no one was hurt. Reporting is not about blame. It is how we keep each other safe."],
["What to report",[["Injuries and illness","cross"],["Spills and damage","drop"],["Broken equipment","machine"],["Security concerns","lock"]],"Report injuries and illnesses, no matter how small. Report near misses, where something almost went wrong. Report property damage, chemical spills, broken equipment, safety hazards, security concerns, and any exposure to blood or chemicals. Tell your supervisor right away, and put it in writing as soon as you can."],
["Write a good report",[["Who, what, when, where, how","clip"],["Facts only","doc"],["Sign and date","check"]],"Be clear, factual, and quick. Record who, what, when, where, and how. Describe what happened, not what you think someone did wrong. Include the names of witnesses and any steps you took. Sign and date the report. If you are not sure how to fill out the form, ask your supervisor."],
["Injury response",[["Call 911","phone"],["Tell your supervisor","person"],["Do not move the injured","cross"],["First aid only if trained","shield"]],"If someone is seriously hurt or in danger, call emergency services first. In the United States, that is 911. Then notify your supervisor. Stay with the person and stay calm. Do not move someone who may have a neck, back, or head injury unless they are in immediate danger. Give first aid only if you are trained. Follow the instructions of the emergency operator."],
["Fire",[["Pull the alarm","alarm"],["Call 911","phone"],["Use the nearest exit","building"],["No elevators","stop"]],"If you see fire or smell smoke, activate the nearest alarm, call emergency services, and leave the building by the nearest safe exit. Do not use elevators. Close doors behind you if it is safe. A fire extinguisher is for small fires only, and only if you have been trained, the exit is behind you, and the fire is not spreading. If in doubt, get out."],
["Chemical and spill emergencies",[["Follow the SDS","book"],["Leave and keep others away","people"],["Call for help","phone"]],"For a chemical exposure, follow the first aid steps from the label and the SDS, call for help, and report it. For a large spill, leave the area, keep others away, and call your supervisor. Do not attempt a cleanup you have not been trained for. Ventilate if it is safe to do so."],
["Weather, power, and security",[["Know the site plan","clip"],["Flashlight, not flame","bolt"],["Safety before property","shield"]],"Know your site's plan for severe weather, power outages, and lockdowns. In a power outage, use a flashlight, not a flame. In severe weather, move away from windows. If you see a security threat, move to safety and call emergency services. Follow your site's plan, and do not put yourself in danger to protect property."],
["Know your site",[["Exits and assembly point","building"],["First aid and eyewash","cross"],["Extinguisher location","alarm"],["Emergency contacts","phone"]],"At every new site, learn the address, the nearest exits and assembly point, and the locations of the first aid kit, fire extinguisher, and eyewash. Write your supervisor's number in your phone. Five minutes of preparation can save a life."]],
["Who do you call first for a serious injury?","Emergency services, then your supervisor."]],
["Professional Conduct and Quality Control",[
["You represent us",[["Face of the company","person"],["Clients trust us","lock"],["Earn it every shift","star"]],"When you walk into a client's building, you are the face of City Cleaning Partners. How you look, speak, and act shapes how clients see us. Clients trust us with their space. Our job is to earn that trust every shift."],
["Appearance and attendance",[["Uniform and ID","person"],["On time","timer"],["Call early if delayed","phone"]],"Wear your uniform and ID as required, keep your clothes clean, and wear the right footwear. Arrive on time. If you are going to be late or absent, tell your supervisor as early as you can so coverage can be arranged. Reliability matters in this work because buildings depend on it."],
["Respect and communication",[["Courtesy","people"],["Report harassment","alarm"],["Don't promise, pass it on","phone"]],"Treat everyone with courtesy: clients, tenants, visitors, and coworkers. Be polite, listen, and speak respectfully. Do not tolerate harassment or discrimination from anyone, and do not take part in it. If you experience or see it, report it to your supervisor or the contact listed in company policy. If a client has a request that you cannot handle, do not promise. Say you will pass it to your supervisor."],
["Property, privacy, and security",[["Respect property","building"],["Protect keys and codes","lock"],["Keep confidences","eye"],["Report problems honestly","clip"]],"Treat client property as if it were your own. Do not use client phones, computers, or supplies for personal reasons. Do not take anything that is not yours. Lock doors and set alarms when you are told to. Never share your keys, codes, or access cards. Never discuss what you see or hear in a client's building. Report anything missing, broken, or unusual right away, even if you think someone may blame you. Honesty protects you."],
["Phones, breaks, and focus",[["Phone on breaks","phone"],["Stay aware","eye"],["Take your breaks","timer"]],"Keep personal phone use to your breaks unless it is needed for work. Do not wear earbuds in a way that stops you from hearing alarms or people. Take breaks where allowed. Tired workers make mistakes, so keep hydrated and take your breaks."],
["Quality starts with a checklist",[["Use the checklist","clip"],["Inspect your work","eye"],["Fix before you leave","check"]],"Quality is not luck. It comes from a system. Use the checklist for each site and area. Check each item as you complete it. After you finish, inspect your work: look at it from different angles, in good light. Check floors for streaks, restrooms for missed spots, and trash cans for liners. If you would not be happy to see it as a client, fix it."],
["Inspections and feedback",[["Listen","people"],["Ask questions","phone"],["Fix quickly","check"],["Follow up","clip"]],"Supervisors will inspect work to help you improve. Feedback is not a personal attack. It is how everyone gets better. Listen, ask questions, and fix issues quickly. If a client complains, stay calm, apologize for the inconvenience, and tell your supervisor. Then follow up so it does not happen again."],
["Take pride",[["Do it right","check"],["Do it safely","shield"],["Do it with respect","people"]],"This is skilled work, and the results are visible. A clean, safe building is something you can be proud of. Do it right, do it safely, and do it with respect."]],
["A client asks for something outside your job. What do you do?","Do not promise. Refer it to your supervisor."]],
["Final Assessment and Supervisor Authorization",[
["You have made it",[["Written test","doc"],["Hands-on evaluation","clip"],["Authorization","check"]],"Congratulations. You have completed eleven modules of training. Now it is time to show what you know. The final assessment has two parts: a written test and a hands-on evaluation with your supervisor. Passing both is how you earn authorization to work on your own."],
["The written assessment",[["Covers all modules","book"],["Take your time","timer"],["Retakes allowed","check"]],"The written test draws on all of the modules. It covers safety, PPE, chemicals, slip and fall prevention, equipment, restroom procedures, floor care, special facilities, post-construction work, emergencies, and professional conduct. Take your time, read each question, and ask for help if you do not understand the wording. If you do not pass the first time, you will review the material and try again."],
["The practical evaluation",[["Cart and chemicals","bucket"],["PPE and wet floor safety","glove"],["Machine and restroom","machine"],["Simulated incident","alarm"]],"Your supervisor will watch you complete real tasks. You will inspect and set up your cart, choose and dilute a chemical correctly, put on and remove PPE, set up wet floor signs and mop safely, operate a floor machine you are assigned, clean a restroom in the correct order, and respond to a simulated incident. Your supervisor is looking for safe habits, not perfection."],
["What supervisors look for",[["Labels followed","flask"],["PPE worn","glove"],["No mixing","stop"],["Safe work area","sign"]],"Your supervisor will check that you follow labels and procedures, wear the right PPE, never mix chemicals, keep your work area safe, use equipment correctly, work in the right order, communicate clearly, and ask questions when you are unsure. Safe habits matter more than speed."],
["Authorization",[["Signed by supervisor","check"],["Specific to your tasks","clip"],["Refreshers as needed","book"]],"When you pass both parts, your supervisor will sign your authorization. This confirms that you have been trained and evaluated on the work you will perform. It is specific to the tasks and equipment you were checked on. Some equipment, sites, or chemicals may need additional training before you can use them. Authorization can be reviewed or withdrawn if safety practices are not followed, and refresher training will be provided when needed. Training never really ends."],
["Welcome to the team",[["Ask questions","phone"],["Report hazards","alarm"],["Take pride","star"]],"You are now part of a team that keeps buildings clean, safe, and working. If you ever have a question, speak up. If you see a hazard, report it. If you need help, ask. Welcome to the team at City Cleaning Partners. Stay safe, and take pride in your work."]],
["What does your authorization cover?","The tasks and equipment you were evaluated on."]]
];
var m=0,i=0,playing=false,timer=null,synth=window.speechSynthesis,hasTTS=!!(synth&&window.SpeechSynthesisUtterance);
var $=function(x){return document.getElementById(x)};
$("msel").innerHTML=M.map(function(x,k){return '<option value="'+k+'">'+(k+1)+'. '+x[0]+'</option>'}).join("");
function wrap(t,n){var w=t.split(" "),l=[""];w.forEach(function(x){if((l[l.length-1]+" "+x).length>n&&l[l.length-1])l.push(x);else l[l.length-1]=(l[l.length-1]+" "+x).trim()});return l}
function tiles(p){var n=p.length,gap=14,w=(608-(n-1)*gap)/n,sz=Math.min(w-34,120),o="";
  p.forEach(function(q,k){var x=16+k*(w+gap),cx=x+w/2,sc=sz/100,lines=wrap(q[0],Math.max(8,Math.floor(w/11)));
   o+='<rect x="'+x+'" y="40" width="'+w+'" height="280" rx="8" class="w" stroke="#14213D" stroke-width="3"/><g transform="translate('+(cx-sz/2)+',70) scale('+sc+')">'+IC[q[1]]+'</g>'+
   lines.map(function(s,j){return '<text x="'+cx+'" y="'+(70+sz+40+j*24)+'" text-anchor="middle" font-size="19" font-weight="800" class="n">'+s+'</text>'}).join("")});return o}
function dots(){var n=M[m][1].length+1;$("dots").innerHTML=Array.apply(null,Array(n)).map(function(_,k){return '<button aria-label="Scene '+(k+1)+'" class="'+(k===i?'on':k<i?'done':'')+'" data-k="'+k+'"></button>'}).join("")}
function stopSpeech(){clearTimeout(timer);if(hasTTS)synth.cancel()}
function show(k){
  var sc=M[m][1];i=Math.max(0,Math.min(sc.length,k));stopSpeech();dots();$("msel").value=m;$("mod").textContent="Module "+(m+1)+" of 12";
  if(i===sc.length){var q=M[m][2];$("pic").style.aspectRatio="auto";
    $("pic").innerHTML='<div class="quiz"><h2 style="margin:0 0 8px">Quick check</h2><details><summary>'+q[0]+'</summary><p style="margin:8px 0 0">'+q[1]+'</p></details><p style="color:var(--muted)">'+(m<11?"Press Next module when you are ready.":"You have finished all 12 modules.")+'</p>'+(m<11?'<button id="nm">Next module</button>':'')+'</div>';
    if($("nm"))$("nm").onclick=function(){m++;show(0)};$("ttl").textContent="Module "+(m+1)+" complete";$("cap").textContent="Open the question to check your answer.";setPlay(false);return}
  var s=sc[i];$("pic").style.aspectRatio="16/9";$("pic").innerHTML='<svg viewBox="0 0 640 360" aria-hidden="true">'+tiles(s[1])+'</svg>';
  $("ttl").textContent=s[0];$("cap").textContent=s[2];if(playing)speak();
}
function speak(){stopSpeech();var sc=M[m][1],s=sc[i],done=function(){if(playing){if(i<sc.length)show(i+1)}};
  if(hasTTS){var u=new SpeechSynthesisUtterance(s[2]);u.rate=parseFloat($("spd").value);u.lang="en-US";u.onend=done;synth.speak(u)}
  else timer=setTimeout(done,s[2].split(" ").length/2.3*1000/parseFloat($("spd").value))}
function setPlay(p){playing=p;$("play").textContent=p?"Pause":"Play"}
$("play").onclick=function(){if(playing){setPlay(false);stopSpeech()}else{if(i>=M[m][1].length)show(0);setPlay(true);speak()}};
$("next").onclick=function(){if(i>=M[m][1].length&&m<11){m++;show(0)}else show(i+1)};
$("prev").onclick=function(){if(i===0&&m>0){m--;show(0)}else show(i-1)};
$("dots").onclick=function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-k");if(k!==null&&k!==undefined)show(+k)};
$("msel").onchange=function(){m=+this.value;setPlay(false);show(0)};
$("spd").onchange=function(){if(playing)speak()};
$("cc").onclick=function(){var off=$("cap").classList.toggle("off");this.setAttribute("aria-pressed",!off);this.textContent=off?"Captions off":"Captions on"};
$("note").textContent=hasTTS?"Narration uses your device's built-in voice, so it sounds different on each device. Choose a module from the menu.":"This browser has no built-in voice, so scenes advance on a timer. Read the captions below the picture.";
show(0);
</script>
